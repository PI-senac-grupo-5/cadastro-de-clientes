<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro de Clientes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="navegacao">
      <div class="conteudo navegacao-interno">
        <span class="navegacao-marca">Cadastro de Clientes</span>
        <nav class="navegacao-links">
          <a href="#cadastro">Novo cadastro</a>
          <a href="clientes/consulta-cliente.html">Consultar clientes</a>
        </nav>
      </div>
    </header>

    <main class="conteudo principal">
      <section class="cartao" id="cadastro">
        <p class="sobretitulo sobretitulo-escuro">
          <span class="pulso"></span>Novo cliente
        </p>
        <h2 class="titulo">Dados do cliente</h2>

        <form class="formulario" action="#" method="post">
          <fieldset>
            <legend>Informações pessoais</legend>

            <div class="campo campo-inteiro">
              <label for="nome">Nome completo *</label>
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Maria da Silva"
                required
              />
            </div>

            <div class="campo">
              <label for="cpf">CPF *</label>
              <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                inputmode="numeric"
                required
              />
            </div>

            <div class="campo">
              <label for="nascimento">Data de nascimento</label>
              <input type="date" id="nascimento" name="nascimento" />
            </div>

            <div class="campo">
              <label for="sexo">Sexo</label>
              <select id="sexo" name="sexo">
                <option value="">Selecione</option>
                <option value="feminino">Feminino</option>
                <option value="masculino">Masculino</option>
                <option value="outro">Outro</option>
                <option value="nao-informar">Prefiro não informar</option>
              </select>
            </div>

            <div class="campo">
              <label for="telefone">Telefone *</label>
              <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                required
              />
            </div>

            <div class="campo campo-inteiro">
              <label for="email">E-mail *</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="E-mail"
                required
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Endereço</legend>

            <div class="campo">
              <label for="cep">CEP</label>
              <input
                type="text"
                id="cep"
                name="cep"
                placeholder="00000-000"
                inputmode="numeric"
              />
            </div>
          </fieldset>

          <div class="acoes">
            <button type="submit" class="botao botao-escuro">
              Cadastrar cliente
            </button>
            <button type="reset" class="botao botao-contorno">
              Limpar campos
            </button>
          </div>
        </form>
      </section>
    </main>
    <script src="clientes.js"></script>
  </body>
</html>
